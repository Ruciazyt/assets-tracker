name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AssetsTrackerApp/package-lock.json

      - name: Get version and run number
        id: version
        run: |
          VERSION=$(node -p "require('./AssetsTrackerApp/package.json').version")
          RUN_NUM=${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RUN_NUMBER=$RUN_NUM" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}-build${RUN_NUM}" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: AssetsTrackerApp/node_modules
          key: assets-node-${{ runner.os }}-${{ hashFiles('AssetsTrackerApp/package-lock.json') }}
          restore-keys: |
            assets-node-${{ runner.os }}-

      - name: Setup Android SDK
        run: |
          mkdir -p /home/runner/work/_temp/android-sdk
          echo "sdk.dir=/home/runner/work/_temp/android-sdk" >> AssetsTrackerApp/android/local.properties
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: |
          cd AssetsTrackerApp
          npm install --legacy-peer-deps

      - name: Expo prebuild
        run: |
          cd AssetsTrackerApp
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build APK
        env:
          NODE_ENV: production
        run: |
          cd AssetsTrackerApp/android
          # Add expo module plugin to settings.gradle pluginManagement
          if ! grep -q "expo-module-gradle-plugin" settings.gradle; then
            cat > settings.gradle.tmp << 'SETTINGS_EOF'
pluginManagement {
    includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'AssetsTrackerApp'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
SETTINGS_EOF
            mv settings.gradle.tmp settings.gradle
          fi

          rm -rf ~/.gradle/caches/build-cache-*
          ./gradlew assembleRelease --no-build-cache 2>&1 | tee /tmp/gradle.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== GRADLE FAILURE ==="
            grep -B2 -A8 "FAILURE:\|expo-module-gradle-plugin\|SoftwareComponent" /tmp/gradle.log | tail -40
            exit 1
          fi

      - name: Rename APK
        run: cp AssetsTrackerApp/android/app/build/outputs/apk/release/app-release.apk /tmp/assets-tracker-${{ steps.version.outputs.VERSION }}-build${{ steps.version.outputs.RUN_NUMBER }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            Assets Tracker ${{ steps.version.outputs.VERSION }} (构建 #${{ steps.version.outputs.RUN_NUMBER }})
            - 自动构建发布
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            /tmp/assets-tracker-${{ steps.version.outputs.VERSION }}-build${{ steps.version.outputs.RUN_NUMBER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}