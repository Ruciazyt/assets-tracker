name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AssetsTrackerApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./AssetsTrackerApp/package.json').version")
          RUN_NUM=${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RUN_NUMBER=$RUN_NUM" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}-build${RUN_NUM}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd AssetsTrackerApp
          npm install --legacy-peer-deps

      - name: Expo prebuild
        run: |
          cd AssetsTrackerApp
          npx expo prebuild --platform android --clean

      - name: Debug settings.gradle
        run: cat AssetsTrackerApp/android/settings.gradle

      - name: Build APK
        working-directory: AssetsTrackerApp/android
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -x test \
            -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Verify APK
        run: |
          APK=AssetsTrackerApp/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" && echo "APK found: $(ls -lh $APK)" || (echo "APK not found" && exit 1)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            Assets Tracker ${{ steps.version.outputs.VERSION }} (Build #${{ steps.version.outputs.RUN_NUMBER }})
            - Auto-built via GitHub Actions
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            AssetsTrackerApp/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
